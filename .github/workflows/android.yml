name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Push build log to ci-logs branch (on failure)
        if: failure()
        run: |
          mkdir -p /tmp/logs && cp build.log /tmp/logs/build.log || true
          find app/.cxx -name "*.log" -o -name "CMakeError.log" -o -name "CMakeOutput.log" 2>/dev/null | head -20 | while read f; do cp "$f" "/tmp/logs/$(echo $f | tr '/' '_')"; done || true
          cd /tmp/logs
          git init -q -b ci-logs
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -q -m "build log ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/PS-PKG-Extractor.apk
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS-PKG-Extractor-apk
          path: dist/PS-PKG-Extractor.apk

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/PS-PKG-Extractor.apk \
            --title "Ultima build ($(date -u +%Y-%m-%d) · ${GITHUB_SHA::7})" \
            --notes "Build automatica dal commit ${GITHUB_SHA}. Scarica PS-PKG-Extractor.apk e installalo sul telefono (arm64)." \
            --prerelease --target "${GITHUB_SHA}"
