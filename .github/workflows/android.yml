name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/PS-PKG-Extractor.apk
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS-PKG-Extractor-apk
          path: dist/PS-PKG-Extractor.apk

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/PS-PKG-Extractor.apk \
            --title "Ultima build ($(date -u +%Y-%m-%d) · ${GITHUB_SHA::7})" \
            --notes "Build automatica dal commit ${GITHUB_SHA}. Scarica PS-PKG-Extractor.apk e installalo sul telefono (arm64)." \
            --prerelease --target "${GITHUB_SHA}"
