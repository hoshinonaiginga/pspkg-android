name: Build APK

# - push on main / manual run: build + downloadable artifact (for testing)
# - push of a tag vX.Y.Z: build signed with the release key + GitHub Release
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "PSPKG_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "PSPKG_VERSION_NAME=0.0.0-dev.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          echo "PSPKG_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Release signing key (from secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "PSPKG_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "PSPKG_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Release key loaded."
          else
            echo "::warning::KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets missing: APK will be debug-signed."
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::A release tag needs the release signing key. Add the secrets and re-run."
              exit 1
            fi
          fi

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Push build log to ci-logs branch (on failure)
        if: failure()
        run: |
          mkdir -p /tmp/logs && cp build.log /tmp/logs/build.log || true
          find app/.cxx -name "CMakeError.log" -o -name "CMakeOutput.log" 2>/dev/null | head -20 | while read f; do cp "$f" "/tmp/logs/$(echo $f | tr '/' '_')"; done || true
          cd /tmp/logs
          git init -q -b ci-logs
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -q -m "build log ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Collect APK
        run: |
          mkdir -p dist
          NAME="PS-PKG-Extractor-${PSPKG_VERSION_NAME%%+*}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: dist/${{ env.APK_NAME }}

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Remove the old pre-versioning "latest" release (signed with the retired key).
          gh release delete latest --yes --cleanup-tag || true
          cat > notes.md <<EOF
          Based on [ps4-pkg-tools](https://github.com/xXJSONDeruloXx/ps4-pkg-tools) by **xXJSONDeruloXx** and the PKG core of [shadPS4](https://github.com/shadps4-emu/shadPS4). Thank you!

          **Install:** download \`${APK_NAME}\` and open it on your phone (Android 8.0+, arm64).
          You can also add this repository's URL to [Obtainium](https://github.com/ImranR98/Obtainium) to get updates automatically.
          EOF
          gh release create "$GITHUB_REF_NAME" "dist/$APK_NAME" \
            --title "PS PKG Extractor $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes
