plugins {
    id 'com.android.application'
}

// Release signing comes from the environment (GitHub secrets in CI), never from the repo.
def ksPath = System.getenv('PSPKG_KEYSTORE')
def ksPass = System.getenv('PSPKG_KEYSTORE_PASSWORD')
def hasReleaseKey = ksPath && ksPass && file(ksPath).exists()

// Version comes from the git tag in CI (v1.2.3 -> 1.2.3), with a dev fallback locally.
def appVersionName = System.getenv('PSPKG_VERSION_NAME') ?: '0.0.0-dev'
def appVersionCode = (System.getenv('PSPKG_VERSION_CODE') ?: '1') as int

android {
    namespace 'io.github.hoshinonaiginga.pspkg'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'io.github.hoshinonaiginga.pspkg'
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias System.getenv('PSPKG_KEY_ALIAS') ?: 'pspkg'
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
